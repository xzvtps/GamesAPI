<!DOCTYPE html>
<html>
<head>
    <title>My Games</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .game-card { background: #222; padding: 20px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid #333;}
        .game-card:hover { border-color: #00ffcc; }
        iframe { width: 100%; height: 80vh; border: none; background: black; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <h1>Game Arcade</h1>
    <div id="menu" class="grid"></div>
    <iframe id="gameFrame"></iframe>

    <script>
        // Fetch the JSON file from your repo using the CDN
        fetch('https://cdn.jsdelivr.net/gh/xzvtps/GamesAPI@main/games.json')
            .then(res => res.json())
            .then(games => {
                const menu = document.getElementById('menu');
                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerText = game.name;
                    card.onclick = () => {
                        // Hide menu, show iframe, load the game
                        menu.style.display = 'none';
                        const frame = document.getElementById('gameFrame');
                        frame.src = game.url;
                        frame.style.display = 'block';
                    };
                    menu.appendChild(card);
                });
            });
    </script>
</body>
</html>
